services:
  postgres:
    image: postgres:16-alpine
    container_name: gymstudy-postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: gymstudy
      POSTGRES_USER: gymstudy
      POSTGRES_PASSWORD: gymstudy
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gymstudy']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gymstudy-redis
    ports:
      - '6379:6379'
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
